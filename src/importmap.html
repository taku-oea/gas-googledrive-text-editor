<!--
  =====================================================================
  CodeMirror 6 の読み込み（import map + esm.sh）

  CM6 は @codemirror/state などのコアパッケージが「同一プロセス内で 1 インスタンス」
  であることを前提に設計されている（Facet / StateField を参照同一性で識別するため）。
  複数の URL から別コピーが読み込まれると "Unrecognized extension value" で壊れる。

  そこで各パッケージには ?external=... を付けてコアをバンドルさせず bare specifier
  のまま出力させ、その bare specifier をこの import map で 1 つの URL に固定している。
  これで何個の言語パッケージを足してもコアは必ず 1 インスタンスになる。

  バージョンは全て固定。更新するときは
    npm view @codemirror/state version
  等で確認し、ここの数字を書き換えて clasp push すること。
  esm.sh から取るのはフォールバック。本命は tools/build.mjs が作る content-hash 付きの
  バンドル 1 本（"vendor"。mermaid も遅延チャンクとして同梱）で、`npm run build -- --apply` が
  下の vendor:begin〜end を書き換えて登録する。バージョンを変えるときは package.json と
  tools/build.mjs の ESM_SH の両方を直す。

  自前配信のファイルにはすべて "integrity"（SHA-384 の SRI）を付けている。配信元の中身が
  build の出力と 1 バイトでも違えば読み込みは失敗する（改ざんされたコードを実行しない）。
  esm.sh の項目は URL が並んでいるだけで、スクリプトプロパティ ESM_FALLBACK_ENABLED=true の
  ときしか js.html の Vendor.load() は読みに行かない（既定では使わない）。
-->
